<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>HapiCopi Chromium Core Parser</title>
    <script src="marked.js"></script>
    <script src="mathjax.js?v=3"></script>
    <script src="mermaid.js"></script>
    <script>
        // Cấu hình MathJax v3
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
</head>

<body>
    <!-- Container ẩn để render sơ đồ Mermaid (Phải hiển thị để trình duyệt đo đạc text chính xác, nhưng đưa ra ngoài màn hình) -->
    <div id="mermaid-container"
        style="position: absolute; top: -9999px; left: -9999px; width: 1200px; height: 1200px; overflow: hidden;"></div>


    <script>
        // Khởi tạo Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });

        // Helper sửa lỗi LaTeX thô (ví dụ: \beginbmatrix -> \begin{bmatrix})
        function normalizeLatex(latex) {
            if (!latex) return "";
            let clean = latex.trim();
            const environments = ["matrix", "bmatrix", "pmatrix", "vmatrix", "Vmatrix", "cases", "array", "align", "gather", "equation"];
            for (let env of environments) {
                let beginReg = new RegExp("\\\\begin" + env + "(?![a-zA-Z])", "g");
                let endReg = new RegExp("\\\\end" + env + "(?![a-zA-Z])", "g");
                clean = clean.replace(beginReg, "\\\\begin{" + env + "}");
                clean = clean.replace(endReg, "\\\\end{" + env + "}");
            }
            return clean;
        }

        // 1. Hàm dịch LaTeX sang MathML chuẩn (Cho MS Word)
        function convertLatexToMathML(latex) {
            try {
                // Xóa các ký tự bọc phân cách
                let clean = latex.trim();
                if (clean.startsWith("\\[") && clean.endsWith("\\]")) clean = clean.substring(2, clean.length - 2);
                else if (clean.startsWith("\\(") && clean.endsWith("\\)")) clean = clean.substring(2, clean.length - 2);
                else if (clean.startsWith("$$") && clean.endsWith("$$")) clean = clean.substring(2, clean.length - 2);
                else if (clean.startsWith("$") && clean.endsWith("$")) clean = clean.substring(1, clean.length - 1);

                clean = clean.trim();
                clean = normalizeLatex(clean);

                // Dùng MathJax v3 dịch trực tiếp
                let mml = MathJax.tex2mml(clean);
                return mml;
            } catch (err) {
                console.error("Lỗi biên dịch MathML: ", err);
                return "";
            }
        }

        // Helper dịch các số phân số LaTeX đơn giản
        function parseFractions(latex) {
            if (!latex) return "";
            let fracRegex = /\\(d|t)?frac\s*\{/;
            let match;
            while ((match = fracRegex.exec(latex)) !== null) {
                let index = match.index;
                let numStart = index + match[0].length;
                let numEnd = findMatchingBrace(latex, numStart);
                if (numEnd === -1) break;

                let numerator = latex.substring(numStart, numEnd);

                let denStart = numEnd + 1;
                while (denStart < latex.length && /\s/.test(latex[denStart])) {
                    denStart++;
                }

                if (denStart < latex.length && latex[denStart] === '{') {
                    let denEnd = findMatchingBrace(latex, denStart + 1);
                    if (denEnd === -1) break;

                    let denominator = latex.substring(denStart + 1, denEnd);

                    numerator = parseFractions(numerator);
                    denominator = parseFractions(denominator);

                    let replacement = "(" + numerator + ") / (" + denominator + ")";
                    latex = latex.substring(0, index) + replacement + latex.substring(denEnd + 1);
                } else {
                    break;
                }
            }
            return latex;
        }

        function findMatchingBrace(str, startIdx) {
            let depth = 1;
            for (let i = startIdx; i < str.length; i++) {
                if (str[i] === '{') depth++;
                else if (str[i] === '}') depth--;

                if (depth === 0) return i;
            }
            return -1;
        }

        function parseSqrt(latex) {
            if (!latex) return "";
            // Matches \sqrt with optional [anything] and optional spaces, followed by {
            let sqrtRegex = /\\sqrt\s*(?:\[[^\]]*\])?\s*\{/;
            let match;
            while ((match = sqrtRegex.exec(latex)) !== null) {
                let index = match.index;
                let start = index + match[0].length;
                let end = findMatchingBrace(latex, start);
                if (end === -1) break;

                let content = latex.substring(start, end);
                // Đệ quy xử lý bên trong căn
                content = parseSqrt(content);

                let replacement = "√(" + content + ")";
                latex = latex.substring(0, index) + replacement + latex.substring(end + 1);
            }
            return latex;
        }

        function translateLatexToHtml(latex) {
            if (!latex) return "";
            let result = latex.trim();

            if (result.startsWith("\\[") && result.endsWith("\\]")) result = result.substring(2, result.length - 2);
            else if (result.startsWith("\\(") && result.endsWith("\\)")) result = result.substring(2, result.length - 2);
            else if (result.startsWith("$$") && result.endsWith("$$")) result = result.substring(2, result.length - 2);
            else if (result.startsWith("$") && result.endsWith("$")) result = result.substring(1, result.length - 1);

            result = result.trim();
            result = normalizeLatex(result);

            // Handle arrays first
            let arrayRegex = /\\begin\{array\}\{([^}]*)\}([\s\S]*?)\\end\{array\}/g;
            result = result.replace(arrayRegex, (match, align, content) => {
                let html = '<table class="latex-matrix" style="display: inline-table; border-collapse: collapse; margin: 0 4px; vertical-align: middle; border: none;">';
                let rows = content.split('\\\\');
                for (let row of rows) {
                    if (!row.trim()) continue;
                    html += '<tr>';
                    let cols = row.split('&');
                    for (let col of cols) {
                        let cellContent = translateLatexToHtml(col.trim());
                        html += `<td style="padding: 2px 6px; text-align: center;">${cellContent}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';
                return html;
            });

            // Handle matrices next
            let matrixRegex = /\\begin\{(b|p|v|V|B|)matrix\}([\s\S]*?)\\end\{\1matrix\}/g;
            result = result.replace(matrixRegex, (match, type, content) => {
                let html = '<table class="latex-matrix" style="display: inline-table; border-collapse: collapse; margin: 0 4px; vertical-align: middle; border: none;">';
                let rows = content.split('\\\\');
                for (let row of rows) {
                    if (!row.trim()) continue;
                    html += '<tr>';
                    let cols = row.split('&');
                    for (let col of cols) {
                        let cellContent = translateLatexToHtml(col.trim());
                        html += `<td style="padding: 2px 6px; text-align: center;">${cellContent}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';

                let leftBracket = "", rightBracket = "";
                if (type === 'b') { leftBracket = "["; rightBracket = "]"; }
                else if (type === 'p') { leftBracket = "("; rightBracket = ")"; }
                else if (type === 'v') { leftBracket = "|"; rightBracket = "|"; }
                else if (type === 'V') { leftBracket = "||"; rightBracket = "||"; }
                else if (type === 'B') { leftBracket = "{"; rightBracket = "}"; }

                if (leftBracket) {
                    return `<span style="display: inline-flex; align-items: center;"><span style="font-size: 1.5em; font-weight: 300;">${leftBracket}</span>${html}<span style="font-size: 1.5em; font-weight: 300;">${rightBracket}</span></span>`;
                }
                return html;
            });

            // Handle piecewise functions (cases)
            let casesRegex = /\\begin\{cases\}([\s\S]*?)\\end\{cases\}/g;
            result = result.replace(casesRegex, (match, content) => {
                let html = '<table class="latex-matrix" style="display: inline-table; border-collapse: collapse; margin: 0 4px; vertical-align: middle; border: none;">';
                let rows = content.split('\\\\');
                for (let row of rows) {
                    if (!row.trim()) continue;
                    html += '<tr>';
                    let cols = row.split('&');
                    for (let col of cols) {
                        let cellContent = translateLatexToHtml(col.trim());
                        html += `<td style="padding: 2px 6px; text-align: left;">${cellContent}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';
                return `<span style="display: inline-flex; align-items: center;"><span style="font-size: 2em; font-weight: 300;">{</span>${html}</span>`;
            });

            // Dịch phân số
            result = parseFractions(result);
            result = result.replace(/\\frac\s*(\d)\s*(\d)/g, "($1) / ($2)");
            result = result.replace(/\\frac\s*([a-zA-Z])\s*([a-zA-Z])/g, "($1) / ($2)");
            result = result.replace(/\\frac\s*\\([a-zA-Z]+)\s*\\([a-zA-Z]+)/g, "($1) / ($2)");

            // Dịch căn bậc hai
            result = parseSqrt(result);
            result = result.replace(/\\sqrt\s*([a-zA-Z0-9])/g, "√($1)");

            result = result.replace(/\\E/g, "·");
            result = result.replace(/(\d)\s*(?:\\in|∈|€)\s*([a-zA-Z])/g, "$1 · $2");

            result = result.replace(/\\text\{([^}]+)\}/g, "$1");
            result = result.replace(/\\mathrm\{([^}]+)\}/g, "$1");
            result = result.replace(/\\mathbf\{([^}]+)\}/g, "<b>$1</b>");
            result = result.replace(/\\mathit\{([^}]+)\}/g, "<i>$1</i>");
            result = result.replace(/\\underline\{([^}]+)\}/g, "<u>$1</u>");

            result = result.replace(/\\textbf\{([^}]+)\}/g, "<b>$1</b>");
            result = result.replace(/\\textit\{([^}]+)\}/g, "<i>$1</i>");
            result = result.replace(/\\textsf\{([^}]+)\}/g, "$1");
            result = result.replace(/\\texttt\{([^}]+)\}/g, "<code>$1</code>");

            // Ký tự Hy Lạp
            const greekLower = {
                "alpha": "α", "beta": "β", "gamma": "γ", "delta": "δ",
                "epsilon": "ε", "zeta": "ζ", "eta": "η", "theta": "θ",
                "iota": "ι", "kappa": "κ", "lambda": "λ", "mu": "μ",
                "nu": "ν", "xi": "ξ", "pi": "π", "rho": "ρ",
                "sigma": "σ", "tau": "τ", "upsilon": "υ", "phi": "φ",
                "chi": "χ", "psi": "ψ", "omega": "ω"
            };
            for (let key in greekLower) {
                let r = new RegExp("\\\\" + key + "(?![a-zA-Z])", "g");
                result = result.replace(r, greekLower[key]);
            }

            const greekUpper = {
                "Delta": "Δ", "Omega": "Ω", "Theta": "Θ", "Phi": "Φ",
                "Pi": "Π", "Sigma": "Σ", "Gamma": "Γ", "Lambda": "Λ",
                "Psi": "Ψ", "Xi": "Ξ"
            };
            for (let key in greekUpper) {
                let r = new RegExp("\\\\" + key + "(?![a-zA-Z])", "g");
                result = result.replace(r, greekUpper[key]);
            }

            // Ký hiệu toán học
            const mathSymbols = {
                "lvert": "|", "rvert": "|", "vert": "|", "Vert": "||",
                "times": "×", "div": "÷", "pm": "±", "approx": "≈",
                "infty": "∞", "cdot": "·", "to": "→", "gets": "←",
                "partial": "∂", "nabla": "∇", "forall": "∀", "exists": "∃",
                "emptyset": "∅", "in": "∈", "notin": "∉", "ni": "∋",
                "prod": "∏", "sum": "∑", "minus": "−", "plus": "+",
                "geq": "≥", "leq": "≤", "ge": "≥", "le": "≤", "neq": "≠",
                "sim": "~", "equiv": "≡", "parallel": "∥", "perp": "⊥",
                "angle": "∠", "triangle": "△", "degree": "°", "cap": "∩",
                "cup": "∪", "subset": "⊂", "supset": "⊃", "subseteq": "⊆",
                "supseteq": "⊇", "Leftrightarrow": "⇔", "leftrightarrow": "↔",
                "Rightarrow": "⇒", "rightarrow": "→", "Leftarrow": "⇐",
                "leftarrow": "←", "implies": "⇒", "impliedby": "⇐"
            };
            for (let key in mathSymbols) {
                let r = new RegExp("\\\\" + key + "(?![a-zA-Z])", "g");
                result = result.replace(r, mathSymbols[key]);
            }

            const mathFuncs = ["sin", "cos", "tan", "cot", "sec", "csc", "log", "ln", "lim", "exp", "arccos", "arcsin", "arctan"];
            for (let func of mathFuncs) {
                let r = new RegExp("\\\\" + func + "(?![a-zA-Z])", "g");
                result = result.replace(r, func);
            }

            result = result.replace(/\\,/g, " ").replace(/\\;/g, " ").replace(/\\!/g, "")
                .replace(/\\quad/g, "  ").replace(/\\qquad/g, "    ").replace(/\\\\/g, "<br />");

            result = result.replace(/_\{([^}]+)\}/g, "<sub>$1</sub>")
                .replace(/_([a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF])/g, "<sub>$1</sub>")
                .replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>")
                .replace(/\^([a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF])/g, "<sup>$1</sup>")
                .replace(/\\vec\{([^}]+)\}/g, "vec($1)")
                .replace(/\\bar\{([^}]+)\}/g, "bar($1)")
                .replace(/\\hat\{([^}]+)\}/g, "hat($1)")
                .replace(/\\tilde\{([^}]+)\}/g, "tilde($1)")
                .replace(/\\overline\{([^}]+)\}/g, "overline($1)");

            return result;
        }

        // Tiền xử lý phát hiện các bảng chữ thô (TSV từ Excel, hoặc căn cột bằng nhiều khoảng trắng) để dựng thành Markdown table
        function preprocessPlainTables(text) {
            if (!text) return "";
            let lines = text.split(/\r?\n/);
            if (lines.length < 2) return text;

            let processedLines = [];
            let inTable = false;
            let tableRows = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                // Bỏ qua các dòng chú thích Markdown hoặc code blocks
                if (line.startsWith('#') || line.startsWith('`') || line.includes('|') || line.startsWith('---')) {
                    if (inTable) {
                        flushTable(tableRows, processedLines);
                        inTable = false;
                        tableRows = [];
                    }
                    processedLines.push(lines[i]);
                    continue;
                }

                // Phát hiện dấu phân tách cột: Tab (\t) hoặc từ 2 khoảng trắng trở lên
                let hasTabs = line.includes('\t');
                let hasMultiSpaces = /\s{2,}/.test(line);

                // Dòng trống hoặc không có dấu phân tách cột thì không phải là dòng bảng
                let isTableRow = (hasTabs || hasMultiSpaces) && line.length > 0;

                if (isTableRow) {
                    let cells = [];
                    if (hasTabs) {
                        cells = line.split('\t');
                    } else {
                        cells = line.split(/\s{2,}/);
                    }
                    cells = cells.map(c => c.trim()).filter(c => c.length > 0);

                    // Kiểm tra xem số cột có hợp lệ không (phải có từ 2 cột trở lên)
                    if (cells.length >= 2) {
                        tableRows.push(cells);
                        inTable = true;
                    } else {
                        if (inTable) {
                            flushTable(tableRows, processedLines);
                            inTable = false;
                            tableRows = [];
                        }
                        processedLines.push(lines[i]);
                    }
                } else {
                    if (inTable) {
                        flushTable(tableRows, processedLines);
                        inTable = false;
                        tableRows = [];
                    }
                    processedLines.push(lines[i]);
                }
            }

            if (inTable) {
                flushTable(tableRows, processedLines);
            }

            return processedLines.join('\n');
        }

        // Helper xuất các hàng bảng đã thu thập ra định dạng Markdown table
        function flushTable(rows, outputLines) {
            if (rows.length === 0) return;
            if (rows.length < 2) {
                // Nếu chỉ có 1 dòng thì không đủ cấu trúc bảng, trả lại văn bản thô gốc
                for (let r of rows) {
                    outputLines.push(r.join('  '));
                }
                return;
            }

            // Dòng Header
            outputLines.push('| ' + rows[0].join(' | ') + ' |');
            
            // Dòng Phân cách cột của Markdown (---|---|...)
            let divider = rows[0].map(() => '---');
            outputLines.push('| ' + divider.join(' | ') + ' |');

            // Các dòng dữ liệu tiếp theo
            for (let i = 1; i < rows.length; i++) {
                // Đảm bảo số cột của dòng dữ liệu khớp với dòng header để tránh vỡ bảng
                let rowCells = rows[i];
                while (rowCells.length < rows[0].length) rowCells.push('');
                if (rowCells.length > rows[0].length) rowCells = rowCells.slice(0, rows[0].length);
                
                outputLines.push('| ' + rowCells.join(' | ') + ' |');
            }
        }

        function convertMarkdownToHtml(markdown, isWordTarget) {
            try {
                let text = preprocessPlainTables(markdown);

                // Tự động bọc $$ cho các khối \begin... \end thô chưa được bọc dấu
                const environments = ["matrix", "bmatrix", "pmatrix", "vmatrix", "Vmatrix", "cases", "array", "align", "gather", "equation"];
                for (let env of environments) {
                    let pattern = new RegExp("\\\\begin\\{?" + env + "\\}?[\\s\\S]*?\\\\end\\{?" + env + "\\}?", "g");
                    text = text.replace(pattern, (match, offset) => {
                        let before = text.substring(Math.max(0, offset - 5), offset);
                        let after = text.substring(offset + match.length, offset + match.length + 5);
                        if (before.includes('$') || before.includes('[') || before.includes('(') || 
                            after.includes('$') || after.includes(']') || after.includes(')')) {
                            return match;
                        }
                        return "\n$$\n" + match + "\n$$\n";
                    });
                }

                // Sửa lỗi nhân dấu ngầm
                text = text.replace(/(\d)\s*(?:\\in|∈|€)\s*([a-zA-Z])/g, '$1 \\cdot $2');

                // Lưu trữ các khối toán học để tránh marked.js phá hỏng cấu trúc
                let mathBlocks = [];

                const saveMath = (regex) => {
                    text = text.replace(regex, (match) => {
                        let placeholder = `HCMATHPLACEHOLDER${mathBlocks.length}`;
                        mathBlocks.push(match);
                        return placeholder;
                    });
                };

                // Dịch các khối Display và Inline
                saveMath(/\$\$([\s\S]*?)\$\$/g);
                saveMath(/\\\[([\s\S]*?)\\\]/g);
                saveMath(/\\\(([\s\S]*?)\\\)/g);

                // Dán inline $...$
                text = text.replace(/\$([^$\n]+)\$/g, (match, inner) => {
                    if (inner.includes('\\') || inner.includes('_') || inner.includes('^') || inner.includes('{') || inner.includes('}') || inner.includes('+') || inner.includes('=') || inner.includes('-') || inner.includes('*') || inner.includes('/')) {
                        let placeholder = `HCMATHPLACEHOLDER${mathBlocks.length}`;
                        mathBlocks.push(match);
                        return placeholder;
                    }
                    return match;
                });

                // Dịch Markdown bằng marked.js
                let html = marked.parse(text);

                // Phục hồi các khối toán học và chuyển thành MathML hoặc thẻ span.latex-math
                for (let i = 0; i < mathBlocks.length; i++) {
                    let match = mathBlocks[i];
                    let replacement = "";
                    if (isWordTarget) {
                        let mml = convertLatexToMathML(match);
                        if (mml) replacement = mml;
                        else replacement = match;
                    } else {
                        let encodedLatex = match.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                        replacement = `<span class="latex-math" data-latex="${encodedLatex}"></span>`;
                    }
                    html = html.replace(`HCMATHPLACEHOLDER${i}`, replacement);
                }

                return html;
            } catch (err) {
                console.error("Lỗi parse Markdown: ", err);
                return marked.parse(markdown);
            }
        }

        // Helper to check if an element is part of MathML or KaTeX/MathJax structure
        function isMathOrKaTeXElement(el) {
            let current = el;
            while (current && current.tagName) {
                let name = current.tagName.toLowerCase();
                if (name === 'p' || name === 'li' || name === 'td' || name === 'th' || name === 'tr' || name === 'table' || name === 'body' || name === 'html') {
                    return false;
                }
                // Chỉ bảo toàn các phần tử thuộc cấu trúc MathML chuẩn hoặc thẻ ảnh công thức của chúng ta
                if (name === 'math' || name === 'annotation' || name === 'semantics') {
                    return true;
                }
                if (name === 'img' && current.classList.contains('latex-math-image')) {
                    return true;
                }
                current = current.parentNode;
            }
            return false;
        }

        // Parse LaTeX formulas inside raw HTML content
        function processLatexInHtml(html, isWordTarget) {
            if (!html) return "";
            try {
                let text = html;

                // Tự động bọc $$ cho các khối \begin... \end thô chưa được bọc dấu
                const environments = ["matrix", "bmatrix", "pmatrix", "vmatrix", "Vmatrix", "cases", "array", "align", "gather", "equation"];
                for (let env of environments) {
                    let pattern = new RegExp("\\\\begin\\{?" + env + "\\}?[\\s\\S]*?\\\\end\\{?" + env + "\\}?", "g");
                    text = text.replace(pattern, (match, offset) => {
                        let before = text.substring(Math.max(0, offset - 5), offset);
                        let after = text.substring(offset + match.length, offset + match.length + 5);
                        if (before.includes('$') || before.includes('[') || before.includes('(') || 
                            after.includes('$') || after.includes(']') || after.includes(')')) {
                            return match;
                        }
                        return "\n$$\n" + match + "\n$$\n";
                    });
                }

                // Sửa lỗi nhân dấu ngầm
                text = text.replace(/(\d)\s*(?:\\in|∈|€)\s*([a-zA-Z])/g, '$1 \\cdot $2');

                const replaceMath = (regex) => {
                    text = text.replace(regex, (match, latex) => {
                        if (isWordTarget) {
                            let mml = convertLatexToMathML(match);
                            if (mml) return mml;
                        }
                        return translateLatexToHtml(match);
                    });
                };

                // Dịch các khối Display và Inline
                replaceMath(/\$\$([\s\S]*?)\$\$/g);
                replaceMath(/\\\[([\s\S]*?)\\\]/g);
                replaceMath(/\\\(([\s\S]*?)\\\)/g);

                // Dán inline $...$
                text = text.replace(/\$([^$\n]+)\$/g, (match, inner) => {
                    if (inner.includes('\\') || inner.includes('_') || inner.includes('^') || inner.includes('{') || inner.includes('}') || inner.includes('+') || inner.includes('=') || inner.includes('-') || inner.includes('*') || inner.includes('/')) {
                        if (isWordTarget) {
                            let mml = convertLatexToMathML(match);
                            if (mml) return mml;
                        }
                        return translateLatexToHtml(match);
                    }
                    return match;
                });

                return text;
            } catch (err) {
                console.error("Lỗi parse LaTeX trong HTML: ", err);
                return html;
            }
        }

        async function convertMathContainersAsync(doc, isWordTarget) {
            let promises = [];

            const processContainer = (container, getLatex) => {
                if (!container.parentNode) return;
                let latex = getLatex(container);

                if (latex) {
                    if (isWordTarget) {
                        let replacementHtml = convertLatexToMathML(latex);
                        if (replacementHtml) {
                            let tempSpan = doc.createElement('span');
                            tempSpan.innerHTML = replacementHtml;
                            container.parentNode.replaceChild(tempSpan, container);
                        }
                    } else {
                        // Async image render for Google Docs / PlainText fallback
                        let p = renderLatexToPngAsync(latex).then(result => {
                            if (result && result.data) {
                                let img = doc.createElement('img');
                                img.src = result.data;
                                img.className = 'latex-math-image';
                                if (result.width) img.style.width = result.width + 'px';
                                if (result.height) img.style.height = result.height + 'px';
                                if (result.verticalAlign) img.style.verticalAlign = result.verticalAlign;
                                else img.style.verticalAlign = 'middle';
                                container.parentNode.replaceChild(img, container);
                            } else {
                                // Fallback to Unicode
                                let replacementHtml = translateLatexToHtml(latex);
                                if (replacementHtml) {
                                    let tempSpan = doc.createElement('span');
                                    tempSpan.innerHTML = replacementHtml;
                                    container.parentNode.replaceChild(tempSpan, container);
                                }
                            }
                        });
                        promises.push(p);
                    }
                }
            };

            // Find all KaTeX containers
            let katexContainers = doc.querySelectorAll('.katex');
            for (let container of katexContainers) {
                processContainer(container, c => {
                    let annotation = c.querySelector('annotation');
                    return annotation ? annotation.textContent : (c.getAttribute('aria-label') || c.textContent || "");
                });
            }

            // Find all MathJax containers
            let mathjaxContainers = doc.querySelectorAll('mjx-container, .mathjax, [class*="MathJax"]');
            for (let container of mathjaxContainers) {
                processContainer(container, c => {
                    let annotation = c.querySelector('annotation');
                    return annotation ? annotation.textContent : (c.getAttribute('data-tex') || c.textContent || "");
                });
            }

            // Find all general math containers (e.g. Gemini classes, and our temporary .latex-math spans)
            let generalMathContainers = doc.querySelectorAll('.math-inline, .math-display, .latex-math');
            for (let container of generalMathContainers) {
                processContainer(container, c => c.getAttribute('data-latex') || c.textContent || "");
            }

            await Promise.all(promises);
        }

        function cleanRemainingMathMarkup(doc) {
            try {
                // 1. Dọn dẹp KaTeX còn sót lại: Thay bằng annotation (raw LaTeX) hoặc textContent
                let katexContainers = doc.querySelectorAll('.katex');
                for (let container of katexContainers) {
                    let annotation = container.querySelector('annotation');
                    let rawText = annotation ? annotation.textContent : (container.getAttribute('aria-label') || container.textContent || "");
                    if (rawText && container.parentNode) {
                        let textNode = doc.createTextNode(rawText);
                        container.parentNode.replaceChild(textNode, container);
                    }
                }

                // 2. Dọn dẹp MathJax v3 còn sót lại: Thay bằng data-tex (raw LaTeX) hoặc textContent
                let mathjaxV3Containers = doc.querySelectorAll('mjx-container');
                for (let container of mathjaxV3Containers) {
                    let rawText = container.getAttribute('data-tex') || container.textContent || "";
                    if (rawText && container.parentNode) {
                        let textNode = doc.createTextNode(rawText);
                        container.parentNode.replaceChild(textNode, container);
                    }
                }

                // 3. Dọn dẹp MathJax v2 (các thẻ có class bắt đầu bằng mjx- hoặc chứa MathJax)
                const isMathJaxV2 = (el) => {
                    if (el.closest('math')) return false;
                    let cls = el.className;
                    if (typeof cls === 'string') {
                        cls = cls.toLowerCase();
                        return cls.includes('mathjax') || cls.includes('mjx-') || cls.includes('mjxc-');
                    }
                    return false;
                };

                let allElements = Array.from(doc.querySelectorAll('*'));
                let topLevelMathJaxV2 = allElements.filter(el => {
                    if (!isMathJaxV2(el)) return false;
                    let parent = el.parentNode;
                    while (parent && parent.tagName) {
                        if (isMathJaxV2(parent)) return false;
                        parent = parent.parentNode;
                    }
                    return true;
                });

                for (let el of topLevelMathJaxV2) {
                    if (el.parentNode) {
                        let text = el.textContent || "";
                        text = text.replace(/\s+/g, ' ').trim();
                        if (text) {
                            let textNode = doc.createTextNode(text);
                            el.parentNode.replaceChild(textNode, el);
                        } else {
                            el.remove();
                        }
                    }
                }
            } catch (e) {
                console.error("Lỗi trong cleanRemainingMathMarkup:", e);
            }
        }

        async function renderLatexToPngAsync(latex) {
            return new Promise((resolve) => {
                try {
                    let clean = latex.trim();
                    if (clean.startsWith("\\[") && clean.endsWith("\\]")) clean = clean.substring(2, clean.length - 2);
                    else if (clean.startsWith("\\(") && clean.endsWith("\\)")) clean = clean.substring(2, clean.length - 2);
                    else if (clean.startsWith("$$") && clean.endsWith("$$")) clean = clean.substring(2, clean.length - 2);
                    else if (clean.startsWith("$") && clean.endsWith("$")) clean = clean.substring(1, clean.length - 1);
                    clean = clean.trim();
                    clean = normalizeLatex(clean);

                    let svgContainer = MathJax.tex2svg(clean);
                    let svgElement = svgContainer.querySelector('svg');

                    if (!svgElement) {
                        resolve(null);
                        return;
                    }

                    let viewBox = svgElement.getAttribute('viewBox');
                    let widthPx = 100, heightPx = 50;
                    let scale = 1.25; // Scale up slightly for crisper rendering

                    let verticalAlign = svgElement.style.verticalAlign;

                    if (viewBox) {
                        let parts = viewBox.split(' ');
                        widthPx = parseFloat(parts[2]) * scale / 100;
                        heightPx = parseFloat(parts[3]) * scale / 100;

                        let retinaScale = 3;
                        let canvas = document.createElement('canvas');
                        canvas.width = widthPx * retinaScale;
                        canvas.height = heightPx * retinaScale;
                        let ctx = canvas.getContext('2d');
                        ctx.scale(retinaScale, retinaScale);

                        const svgString = new XMLSerializer().serializeToString(svgElement);
                        const base64Svg = btoa(unescape(encodeURIComponent(svgString)));
                        const dataURL = 'data:image/svg+xml;base64,' + base64Svg;

                        const image = new Image();
                        image.onload = () => {
                            ctx.drawImage(image, 0, 0, widthPx, heightPx);
                            resolve({ data: canvas.toDataURL('image/png'), width: widthPx, height: heightPx, verticalAlign: verticalAlign });
                        };
                        image.onerror = () => resolve(null);
                        image.src = dataURL;
                    } else {
                        resolve(null);
                    }
                } catch (err) {
                    console.error("Render Math PNG error", err);
                    resolve(null);
                }
            });
        }

        function normalizeCode(code) {
            return code.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        }

        function lookupMermaidCache(code, cache) {
            let normCode = normalizeCode(code);
            for (let key in cache) {
                if (normalizeCode(key) === normCode) {
                    return cache[key];
                }
            }
            return null;
        }

        function decodeHtmlEntities(text) {
            let textArea = document.createElement('textarea');
            textArea.innerHTML = text;
            return textArea.value;
        }

        // Tự động nhận diện và chuyển đổi các bảng biểu giả lập bằng div (div-based grid/flex tables) thành table thực tế
        function reconstructDivTables(doc) {
            try {
                // 1. Tìm các thẻ div đóng vai trò làm bảng bằng role, class hoặc style
                let tableCandidates = doc.querySelectorAll('div[role="table"], div.table, div[class*="table-"], div[style*="display: table"]');
                
                for (let cand of tableCandidates) {
                    if (cand.tagName.toLowerCase() === 'table') continue;

                    // Tạo thẻ table chuẩn
                    let table = doc.createElement('table');
                    let id = cand.getAttribute('id');
                    if (id) table.setAttribute('id', id);

                    // 2. Tìm các hàng (rows)
                    let rows = cand.querySelectorAll('div[role="row"], div.tr, div[class*="row-"], div[style*="display: table-row"]');
                    if (rows.length === 0) {
                        // Nếu không có class/role rõ rệt, coi các con trực tiếp của table là hàng
                        rows = Array.from(cand.children).filter(c => c.tagName.toLowerCase() === 'div');
                    }

                    let hasAddedRow = false;
                    for (let r of rows) {
                        let tr = doc.createElement('tr');

                        // 3. Tìm các ô (cells)
                        let cells = r.querySelectorAll('div[role="cell"], div[role="gridcell"], div[role="columnheader"], div.td, div.th, div[class*="cell-"], div[style*="display: table-cell"]');
                        if (cells.length === 0) {
                            // Nếu không có class/role rõ rệt, coi các con trực tiếp của hàng là ô
                            cells = Array.from(r.children).filter(c => c.tagName.toLowerCase() === 'div' || c.tagName.toLowerCase() === 'span');
                        }

                        if (cells.length > 0) {
                            for (let c of cells) {
                                let isHeader = c.tagName.toLowerCase() === 'th' || 
                                               c.classList.contains('th') || 
                                               c.getAttribute('role') === 'columnheader' ||
                                               c.classList.contains('column-header');
                                
                                let cellElement = doc.createElement(isHeader ? 'th' : 'td');

                                // Di chuyển toàn bộ nội dung từ div cũ sang cell mới
                                while (c.firstChild) {
                                    cellElement.appendChild(c.firstChild);
                                }

                                // Giữ lại thuộc tính gộp dòng/gộp cột nếu có
                                let colspan = c.getAttribute('colspan');
                                if (colspan) cellElement.setAttribute('colspan', colspan);
                                let rowspan = c.getAttribute('rowspan');
                                if (rowspan) cellElement.setAttribute('rowspan', rowspan);

                                tr.appendChild(cellElement);
                            }
                            table.appendChild(tr);
                            hasAddedRow = true;
                        }
                    }

                    // Thay thế div bảng giả lập bằng table chuẩn vừa dựng
                    if (hasAddedRow && cand.parentNode) {
                        cand.parentNode.replaceChild(table, cand);
                    }
                }
            } catch (e) {
                console.error("Lỗi trong reconstructDivTables: ", e);
            }
        }

        // 4. Hàm làm sạch HTML rác bằng DOM Parser của trình duyệt và tịnh tiến Heading
        async function doCleanHtmlAsync(html, fontName, fontSize, lineSpacing, parentHeadingLevel, isWordTarget, mermaidCacheJson) {
            if (!html) return "";
            try {
                function hasHeadingAncestor(el) {
                    let current = el.parentNode;
                    while (current && current.tagName) {
                        let name = current.tagName.toLowerCase();
                        if (/^h[1-9]$/.test(name)) {
                            return true;
                        }
                        current = current.parentNode;
                    }
                    return false;
                }

                const targetTextTags = ['p', 'li', 'td', 'th', 'span', 'strong', 'b', 'em', 'i', 'u', 'ins', 'del', 's', 'strike', 'a', 'div', 'font', 'mark', 'cite', 'q', 'dfn', 'abbr', 'small', 'blockquote'];

                // Phân giải các ký tự LaTeX delimiters còn sót lại trong HTML trước khi dọn dẹp
                let parsedHtml = processLatexInHtml(html, isWordTarget);

                let parser = new DOMParser();
                let doc = parser.parseFromString(parsedHtml, 'text/html');

                // Thay thế tất cả các container KaTeX/MathJax bằng MathML hoặc PNG tương ứng để hiển thị mượt mà trên Word/Docs
                await convertMathContainersAsync(doc, isWordTarget);

                // Dọn dẹp tất cả các thẻ MathJax v2/v3 và KaTeX còn sót lại chưa vẽ được thành ảnh
                cleanRemainingMathMarkup(doc);

                // Tự động tái cấu trúc bảng biểu giả lập div-based thành table thực tế
                reconstructDivTables(doc);

                // Giải mã và thay thế sơ đồ Mermaid từ cache
                let mermaidCache = {};
                if (mermaidCacheJson) {
                    try {
                        mermaidCache = JSON.parse(mermaidCacheJson);
                    } catch (e) {
                        console.error("Lỗi parse mermaidCache:", e);
                    }
                }

                let mermaidContainers = doc.body.querySelectorAll('pre code.language-mermaid, div.mermaid, pre.mermaid');
                for (let container of mermaidContainers) {
                    let code = container.textContent.trim();
                    let decodedCode = decodeHtmlEntities(code);
                    let base64Data = lookupMermaidCache(decodedCode, mermaidCache);
                    if (base64Data) {
                        let img = doc.createElement('img');
                        img.src = base64Data;
                        img.style.maxWidth = '100%';
                        img.style.display = 'block';
                        img.style.margin = '10px 0';

                        let targetToReplace = container;
                        if (container.tagName.toLowerCase() === 'code' && container.parentNode && container.parentNode.tagName.toLowerCase() === 'pre') {
                            targetToReplace = container.parentNode;
                        }
                        if (targetToReplace.parentNode) {
                            targetToReplace.parentNode.replaceChild(img, targetToReplace);
                        }
                    }
                }

                let parentLevel = parentHeadingLevel || 0;

                let allElements = doc.body.querySelectorAll('*');
                for (let el of allElements) {
                    // Nếu là phần tử MathML hoặc KaTeX/MathJax, giữ nguyên không dọn dẹp để bảo toàn cấu trúc render
                    if (isMathOrKaTeXElement(el)) {
                        continue;
                    }

                    let name = el.tagName.toLowerCase();
                    if (name === 'col' || name === 'colgroup' || name === 'meta' || name === 'title' || name === 'link' || name === 'style' || name === 'script') {
                        el.remove();
                        continue;
                    }

                    // Lột class rác để tránh Google Docs nhận nhầm hoặc thừa kế CSS của web nguồn
                    let keepClasses = ['latex-math', 'latex-matrix', 'latex-math-image'];
                    let classList = Array.from(el.classList);
                    for (let cls of classList) {
                        if (!keepClasses.includes(cls)) {
                            el.classList.remove(cls);
                        }
                    }

                    // Đọc in đậm, in nghiêng, căn lề và độ rộng hiện hành trước khi xóa style
                    let computedStyle = window.getComputedStyle(el);
                    let isBold = computedStyle.fontWeight === 'bold' ||
                        parseInt(computedStyle.fontWeight) >= 600 ||
                        el.style.fontWeight === 'bold' ||
                        parseInt(el.style.fontWeight) >= 600 ||
                        name === 'b' || name === 'strong';

                    let isItalic = computedStyle.fontStyle === 'italic' ||
                        el.style.fontStyle === 'italic' ||
                        name === 'i' || name === 'em';

                    let textDec = computedStyle.textDecoration || '';
                    let isUnderline = textDec.includes('underline') ||
                        (el.style.textDecoration && el.style.textDecoration.includes('underline')) ||
                        name === 'u';

                    let isStrike = textDec.includes('line-through') ||
                        (el.style.textDecoration && el.style.textDecoration.includes('line-through')) ||
                        name === 's' || name === 'del' || name === 'strike';

                    let align = el.style.textAlign || el.getAttribute('align') || '';
                    let width = el.style.width || el.getAttribute('width') || '';
                    let colspan = el.getAttribute('colspan') || '';
                    let rowspan = el.getAttribute('rowspan') || '';

                    // Lột style rác
                    el.removeAttribute('style');

                    // Dựng lại style sạch sẽ
                    let cleanStyles = [];
                    if (isBold) cleanStyles.push('font-weight: bold;');
                    if (isItalic) cleanStyles.push('font-style: italic;');

                    let deco = [];
                    if (isUnderline) deco.push('underline');
                    if (isStrike) deco.push('line-through');
                    if (deco.length > 0) cleanStyles.push('text-decoration: ' + deco.join(' ') + ';');

                    if (align) cleanStyles.push('text-align: ' + align + ';');
                    if (width) {
                        if (/^\d+$/.test(width)) width += 'px';
                        cleanStyles.push('width: ' + width + ';');
                    }

                    // Áp dụng structural styles cho các thẻ đặc biệt
                    if (name === 'table') {
                        if (el.classList.contains('latex-matrix')) {
                            cleanStyles.push('display: inline-table; border-collapse: collapse; margin: 0 4px; vertical-align: middle; border: none;');
                        } else {
                            // Đếm số cột để quyết định chiều rộng bảng thông minh
                            let firstRow = el.querySelector('tr');
                            let colCount = 0;
                            if (firstRow) {
                                colCount = firstRow.querySelectorAll('td, th').length;
                            }
                            if (colCount > 8) {
                                // Bảng rộng (Kaggle DataFrame, bảng dữ liệu lớn): để width tự nhiên, tránh ép chữ xếp dọc
                                cleanStyles.push('border-collapse: collapse; width: auto; border: 1px solid #cccccc; margin: 6pt 0;');
                            } else {
                                // Bảng hẹp (3-6 cột): trải rộng 100% cho đẹp
                                cleanStyles.push('border-collapse: collapse; width: 100%; border: 1px solid #cccccc; margin: 6pt 0;');
                            }
                        }
                    } else if (name === 'th') {
                        if (el.closest('table.latex-matrix')) {
                            cleanStyles.push('padding: 2px 6px; text-align: center; border: none;');
                        } else {
                            // Thêm white-space: nowrap cho bảng rộng để tránh chữ xếp dọc
                            let parentTable = el.closest('table');
                            let isWideTable = false;
                            if (parentTable) {
                                let fr = parentTable.querySelector('tr');
                                if (fr && fr.querySelectorAll('td, th').length > 8) isWideTable = true;
                            }
                            cleanStyles.push('border: 1px solid #cccccc; padding: 6px; background-color: #f2f2f2; text-align: left;' + (isWideTable ? ' white-space: nowrap;' : ''));
                        }
                    } else if (name === 'td') {
                        if (el.closest('table.latex-matrix')) {
                            cleanStyles.push('padding: 2px 6px; text-align: center; border: none;');
                        } else {
                            let parentTable = el.closest('table');
                            let isWideTable = false;
                            if (parentTable) {
                                let fr = parentTable.querySelector('tr');
                                if (fr && fr.querySelectorAll('td, th').length > 8) isWideTable = true;
                            }
                            cleanStyles.push('border: 1px solid #cccccc; padding: 6px; text-align: left;' + (isWideTable ? ' white-space: nowrap;' : ''));
                        }
                    } else if (name === 'pre') {
                        cleanStyles = ["font-family: 'Consolas', 'Courier New', monospace;", "font-size: 10pt;", "background-color: #f8f9fa;", "border: 1px solid #e9ecef;", "padding: 8pt;", "margin: 6pt 0;", "white-space: pre;", "line-height: 1.2;", "color: #212529;"];
                    } else if (name === 'code') {
                        cleanStyles = ["font-family: 'Consolas', 'Courier New', monospace;", "font-size: 10pt;", "background-color: #f8f9fa;", "border: 1px solid #e9ecef;", "padding: 2px 4px;", "border-radius: 3px;", "color: #e83e8c;"];
                    } else if (name === 'blockquote') {
                        cleanStyles.push("border-left: 3px solid #cccccc; padding-left: 10pt; margin: 6pt 0 6pt 12pt; color: #555555; font-style: italic;");
                    } else if (name === 'a') {
                        cleanStyles.push("color: #0563c1; text-decoration: underline;");
                    }

                    // Đồng hóa font-family và font-size cho các thẻ văn bản thường (không áp dụng cho pre, code, table)
                    if (fontName && name !== 'pre' && name !== 'code' && name !== 'table') {
                        if (targetTextTags.includes(name)) {
                            cleanStyles.push("font-family: '" + fontName + "';");
                            // Chỉ áp dụng font-size nếu không nằm trong Heading (tránh ghi đè font-size của Heading)
                            if (fontSize && !hasHeadingAncestor(el)) {
                                cleanStyles.push("font-size: " + fontSize + "pt;");
                            }
                            if (lineSpacing && (name === 'p' || name === 'li')) {
                                cleanStyles.push("line-height: " + lineSpacing + ";");
                            }
                        } else if (name === 'sub' || name === 'sup') {
                            cleanStyles.push("font-family: '" + fontName + "';");
                            cleanStyles.push("font-size: 75%;");
                        }
                    }

                    if (cleanStyles.length > 0) {
                        el.setAttribute('style', cleanStyles.join(' '));
                    }

                    if (colspan) el.setAttribute('colspan', colspan);
                    if (rowspan) el.setAttribute('rowspan', rowspan);

                    // Map class và style Office
                    if (name === 'p') {
                        el.classList.add('MsoNormal');
                    } else if (name === 'table') {
                        el.classList.add('MsoNormalTable');
                    } else if (name === 'h1' || name === 'h2' || name === 'h3' || name === 'h4' || name === 'h5' || name === 'h6') {
                        // Tịnh tiến cấp độ Heading
                        let hLevel = parseInt(name.substring(1));
                        let targetLevel = Math.min(9, parentLevel + hLevel);
                        let msoClass = 'MsoHeading' + targetLevel;

                        // Tạo thẻ Heading mới và thay thế thẻ cũ
                        let newHeading = doc.createElement('h' + targetLevel);
                        newHeading.className = msoClass;

                        // Di chuyển tất cả các nút con sang newHeading để không bị clone/mất tham chiếu
                        while (el.firstChild) {
                            newHeading.appendChild(el.firstChild);
                        }

                        let headingStyle = [];
                        if (fontName) {
                            headingStyle.push("font-family: '" + fontName + "';");
                        }
                        if (fontSize) {
                            let hSize = fontSize;
                            if (targetLevel === 1) hSize = fontSize + 3;
                            else if (targetLevel === 2) hSize = fontSize + 1;
                            else if (targetLevel === 3) hSize = fontSize;
                            else hSize = Math.max(10, fontSize - 1);

                            headingStyle.push("font-size: " + hSize + "pt;");
                        }
                        newHeading.setAttribute('style', headingStyle.join(' '));

                        if (el.parentNode) {
                            el.parentNode.replaceChild(newHeading, el);
                        }
                    }
                }
                return doc.body.innerHTML;
            } catch (err) {
                console.error("Lỗi dọn rác HTML: ", err);
                return html;
            }
        }

        // 5. Hàm dịch LaTeX thô trong Plain Text
        function processLatexInPlainText(text) {
            try {
                let html = translateLatexToHtml(text);
                return stripHtmlForPlainText(html);
            } catch (err) {
                return text;
            }
        }

        function stripHtmlForPlainText(html) {
            let result = html;
            result = result.replace(/<sub>0<\/sub>/g, "₀").replace(/<sub>1<\/sub>/g, "₁").replace(/<sub>2<\/sub>/g, "₂")
                .replace(/<sub>3<\/sub>/g, "₃").replace(/<sub>4<\/sub>/g, "₄").replace(/<sub>5<\/sub>/g, "₅")
                .replace(/<sub>6<\/sub>/g, "₆").replace(/<sub>7<\/sub>/g, "₇").replace(/<sub>8<\/sub>/g, "₈")
                .replace(/<sub>9<\/sub>/g, "₉");
            result = result.replace(/<sup>0<\/sup>/g, "⁰").replace(/<sup>1<\/sup>/g, "¹").replace(/<sup>2<\/sup>/g, "²")
                .replace(/<sup>3<\/sup>/g, "³").replace(/<sup>4<\/sup>/g, "⁴").replace(/<sup>5<\/sup>/g, "⁵")
                .replace(/<sup>6<\/sup>/g, "⁶").replace(/<sup>7<\/sup>/g, "⁷").replace(/<sup>8<\/sup>/g, "⁸")
                .replace(/<sup>9<\/sup>/g, "⁹");

            let temp = document.createElement("div");
            temp.innerHTML = result;
            return temp.textContent || temp.innerText || "";
        }

        window.cleanHtmlResults = window.cleanHtmlResults || {};

        function startCleanHtml(id, html, fontName, fontSize, lineSpacing, parentHeadingLevel, isWordTarget, mermaidCacheJson) {
            window.cleanHtmlResults[id] = { status: 'pending', result: null };
            doCleanHtmlAsync(html, fontName, fontSize, lineSpacing, parentHeadingLevel, isWordTarget, mermaidCacheJson)
                .then(res => {
                    window.cleanHtmlResults[id] = { status: 'success', result: res };
                })
                .catch(err => {
                    window.cleanHtmlResults[id] = { status: 'error', result: err.toString() };
                });
            return 'started';
        }

        // 6. Đối tượng toàn cục lưu kết quả render Mermaid để C# poll kết quả
        window.mermaidResults = window.mermaidResults || {};

        function startRenderMermaid(code, id) {
            window.mermaidResults[id] = { status: 'pending', result: null };
            renderMermaidToPng(code, id).then(res => {
                window.mermaidResults[id] = { status: 'success', result: res };
            }).catch(err => {
                window.mermaidResults[id] = { status: 'error', result: 'ERROR: ' + err.toString() };
            });
            return 'started';
        }

        // Hàm vẽ sơ đồ Mermaid offline ra Base64 PNG ẩn
        async function renderMermaidToPng(code, id) {
            return new Promise(async (resolve) => {
                try {
                    const container = document.getElementById('mermaid-container');
                    container.innerHTML = '';

                    // Render SVG offline từ mã nguồn
                    const { svg } = await mermaid.render('mermaid-svg-' + id, code, container);
                    container.innerHTML = svg;

                    const svgElement = container.querySelector('svg');
                    const width = svgElement.viewBox.baseVal.width || svgElement.width.baseVal.value || 800;
                    const height = svgElement.viewBox.baseVal.height || svgElement.height.baseVal.value || 600;

                    // Convert SVG sang Canvas sang PNG Base64
                    const svgString = new XMLSerializer().serializeToString(svgElement);
                    const base64Svg = btoa(unescape(encodeURIComponent(svgString)));
                    const dataURL = 'data:image/svg+xml;base64,' + base64Svg;

                    const image = new Image();
                    image.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;

                            const context = canvas.getContext('2d');
                            // Tạo nền trắng cho ảnh sơ đồ
                            context.fillStyle = '#ffffff';
                            context.fillRect(0, 0, width, height);
                            context.drawImage(image, 0, 0, width, height);

                            const pngData = canvas.toDataURL('image/png');
                            container.innerHTML = ''; // dọn dẹp
                            resolve(pngData);
                        } catch (canvasErr) {
                            resolve("ERROR: Canvas drawing failed: " + canvasErr.toString());
                        }
                    };
                    image.onerror = (e) => {
                        resolve("ERROR: SVG Image loading failed");
                    };
                    image.src = dataURL;
                } catch (err) {
                    console.error("Lỗi render Mermaid: ", err);
                    resolve("ERROR: " + err.toString());
                }
            });
        }
    </script>
